name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  # Official CodeQL 2.27.4 bundles containing each extractor and its query packs.
  CODEQL_JAVASCRIPT_BUNDLE_ASSET_ID: 692239234
  CODEQL_JAVASCRIPT_BUNDLE_SHA256: 082e798c97831283a2a5f69e9198c51270e5767013d5333daeeab6520af9ce72
  CODEQL_SWIFT_BUNDLE_ASSET_ID: 692239631
  CODEQL_SWIFT_BUNDLE_SHA256: 52e3f0ea756787f0ceb2e5b2553d2560ba1d83573e3f77002f31833b307fbebc

jobs:
  javascript-typescript:
    name: JavaScript and TypeScript
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download checksum-pinned JavaScript analysis tools
        env:
          GITHUB_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download-github-asset.sh github/codeql-action \
            "$CODEQL_JAVASCRIPT_BUNDLE_ASSET_ID" "$CODEQL_JAVASCRIPT_BUNDLE_SHA256" \
            "$RUNNER_TEMP/codeql-bundle-javascript-linux64.tar.zst"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          tools: ${{ runner.temp }}/codeql-bundle-javascript-linux64.tar.zst
          build-mode: none
          queries: security-extended
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:javascript-typescript

  swift:
    name: Swift
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install checksum-pinned Apple build tools
        uses: ./.github/actions/setup-apple-tools
      - name: Create non-signing CI configuration
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig
      - name: Download checksum-pinned Swift analysis tools
        env:
          GITHUB_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download-github-asset.sh github/codeql-action \
            "$CODEQL_SWIFT_BUNDLE_ASSET_ID" "$CODEQL_SWIFT_BUNDLE_SHA256" \
            "$RUNNER_TEMP/codeql-bundle-swift-osx64.tar.zst"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: swift
          tools: ${{ runner.temp }}/codeql-bundle-swift-osx64.tar.zst
          build-mode: manual
          queries: security-extended
      - name: Trace unsigned Apple builds
        run: make build
      - name: Analyze Swift
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:swift
