name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  # Official CodeQL 2.27.4 bundle containing the Swift extractor and query packs.
  CODEQL_SWIFT_BUNDLE_ASSET_ID: 692239631
  CODEQL_SWIFT_BUNDLE_SHA256: 52e3f0ea756787f0ceb2e5b2553d2560ba1d83573e3f77002f31833b307fbebc

jobs:
  javascript-typescript:
    name: JavaScript and TypeScript
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:javascript-typescript

  swift:
    name: Swift
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install checksum-pinned Apple build tools
        uses: ./.github/actions/setup-apple-tools
      - name: Create non-signing CI configuration
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig
      - name: Download checksum-pinned Swift analysis tools
        env:
          GITHUB_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/codeql-bundle-swift-osx64.tar.zst"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            --header "Authorization: Bearer $GITHUB_DOWNLOAD_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --output "$archive" \
            "https://api.github.com/repos/github/codeql-action/releases/assets/${CODEQL_SWIFT_BUNDLE_ASSET_ID}"
          printf '%s  %s\n' "$CODEQL_SWIFT_BUNDLE_SHA256" "$archive" | shasum -a 256 --check
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: swift
          tools: ${{ runner.temp }}/codeql-bundle-swift-osx64.tar.zst
          build-mode: manual
          queries: security-extended
      - name: Trace unsigned Apple builds
        run: make build
      - name: Analyze Swift
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:swift
