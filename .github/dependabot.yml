version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /apps/WristRemoteRelay
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      relay-security:
        applies-to: security-updates
        patterns: ["*"]
      relay-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /apps/WristRemote
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
