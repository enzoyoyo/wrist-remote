name: WristRemote

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

configFiles:
  Debug: ../../Config/WristRemote.xcconfig
  Release: ../../Config/WristRemote.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(WRISTREMOTE_DEVELOPMENT_TEAM)
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 0.3.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WristRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - sdk: CryptoKit.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: WatchConnectivity.framework
      - target: WristRemoteWatchApp
        embed: true
        link: false
    info:
      path: Generated/WristRemote-Info.plist
      properties:
        CFBundleDisplayName: Wrist Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _wristremote._tcp
        NSLocalNetworkUsageDescription: 用于发现并连接同一局域网内运行腕上遥控桥的 Mac。
        WristRemoteRelayBaseURL: $(WRISTREMOTE_RELAY_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTREMOTE_BUNDLE_PREFIX).ios
        PRODUCT_NAME: WristRemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  WristRemoteWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: WatchConnectivity.framework
      - sdk: WatchKit.framework
      - sdk: UserNotifications.framework
    info:
      path: Generated/WristRemoteWatchApp-Info.plist
      properties:
        CFBundleDisplayName: Wrist Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 用于按住语音键时把 Apple Watch 麦克风音频发送到独立腕上遥控桥。
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WRISTREMOTE_BUNDLE_PREFIX).ios
        WKRunsIndependentlyOfCompanionApp: true
        WKPrefersNetworkUponForeground: true
        WristRemoteRelayBaseURL: $(WRISTREMOTE_RELAY_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTREMOTE_BUNDLE_PREFIX).ios.watchkitapp
        PRODUCT_NAME: WristRemoteWatchApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  WristRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: WristRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTREMOTE_BUNDLE_PREFIX).ios.tests
        GENERATE_INFOPLIST_FILE: YES

  WristRemoteWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchUITests
    dependencies:
      - target: WristRemoteWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTREMOTE_BUNDLE_PREFIX).watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WristRemote:
    build:
      targets:
        WristRemote: all
    run:
      config: Debug
    test:
      targets:
        - WristRemoteTests
    archive:
      config: Release

  WristRemoteWatchApp:
    build:
      targets:
        WristRemoteWatchApp: all
    run:
      config: Debug
    test:
      targets:
        - WristRemoteWatchUITests
